<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 680" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#182234" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Blue Button Gradient -->
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Card Drop Shadow Filter -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Button Glow -->
    <filter id="btnGlow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0284c7" flood-opacity="0.4"/>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif; font-weight: 800; font-size: 24px; fill: #38bdf8; }
    .badge { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif; font-weight: 700; font-size: 13px; fill: #38bdf8; }
    .status-text { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif; font-size: 14px; font-weight: 600; fill: #10b981; }
    .label { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif; font-weight: 700; font-size: 15px; fill: #94a3b8; }
    .input-text { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif; font-weight: 600; font-size: 16px; fill: #f8fafc; }
    .btn-text { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif; font-weight: 800; font-size: 16px; fill: #ffffff; text-anchor: middle; }
    .ota-text { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Segoe UI', sans-serif; font-weight: 700; font-size: 15px; fill: #e2e8f0; text-anchor: middle; }
  </style>

  <!-- Canvas Background -->
  <rect width="640" height="680" fill="url(#bgGrad)" rx="24"/>

  <!-- Card Container -->
  <g transform="translate(50, 40)">
    <!-- Card Frame -->
    <rect width="540" height="600" rx="20" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5" filter="url(#cardShadow)"/>

    <!-- Header -->
    <g transform="translate(36, 44)">
      <text x="0" y="24" class="title">SnapMatrix 控制面板</text>
      <!-- Badge -->
      <rect x="375" y="4" width="92" height="26" rx="13" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-opacity="0.35"/>
      <text x="421" y="22" class="badge" text-anchor="middle">v1.1 正式版</text>
    </g>

    <!-- Status Box -->
    <g transform="translate(36, 88)">
      <rect width="468" height="135" rx="12" fill="#10b981" fill-opacity="0.10" stroke="#10b981" stroke-opacity="0.25" stroke-width="1"/>
      
      <!-- Row 1: Device IP & Conn Status -->
      <text x="16" y="28" class="status-text">裝置 IP: 192.168.1.150</text>
      <text x="452" y="28" class="status-text" text-anchor="end">狀態: 已連線</text>

      <!-- Row 2: Firmware Version -->
      <text x="16" y="58" class="status-text" fill="#94a3b8">韌體版本:</text>
      <text x="452" y="58" class="status-text" fill="#38bdf8" text-anchor="end">v1.1</text>

      <!-- Row 3: Printer ROM -->
      <text x="16" y="88" class="status-text" fill="#a78bfa">🖨️ 印表機 ROM:</text>
      <text x="452" y="88" class="status-text" fill="#f8fafc" text-anchor="end">Snapmaker Artisan v1.12.8</text>

      <!-- Row 4: Weather -->
      <text x="16" y="118" class="status-text" fill="#38bdf8">⛅ 當前天氣:</text>
      <text x="452" y="118" class="status-text" fill="#10b981" text-anchor="end">Taipei 26°C 72% (晴天)</text>
    </g>

    <!-- Form Section -->
    <!-- Input 1: Moonraker IP -->
    <g transform="translate(36, 248)">
      <text x="0" y="14" class="label">Moonraker 印表機 IP (Snapmaker):</text>
      <rect x="0" y="24" width="468" height="48" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="54" class="input-text">192.168.1.100</text>
    </g>

    <!-- Input 2: Sleep Timeout -->
    <g transform="translate(36, 342)">
      <text x="0" y="14" class="label">螢幕自動休眠時間 (分鐘，0 為不休眠):</text>
      <rect x="0" y="24" width="468" height="48" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1"/>
      <text x="16" y="54" class="input-text">10</text>
    </g>

    <!-- Submit Button -->
    <g transform="translate(36, 442)">
      <rect width="468" height="48" rx="10" fill="url(#btnGrad)" filter="url(#btnGlow)"/>
      <text x="234" y="30" class="btn-text">💾 儲存設定並重新連線</text>
    </g>

    <!-- OTA Button -->
    <g transform="translate(36, 508)">
      <rect width="468" height="46" rx="10" fill="#334155"/>
      <text x="234" y="29" class="ota-text">🚀 開啟 OTA 韌體無線更新</text>
    </g>
  </g>
</svg>
