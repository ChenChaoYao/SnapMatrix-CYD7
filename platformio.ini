[platformio]
default_envs = esp32-s3-cyd7, esp32-s3-cyd5

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=1
    -DWEBSOCKETS_MAX_DATA_SIZE=32768
    -Ilib/microlink/include
    -Ilib/microlink/src
    -Ilib/microlink/src/wireguard_lwip
    -Ilib/microlink/src/wireguard_lwip/crypto
    -Ilib/microlink/src/wireguard_lwip/crypto/refc
    -DWIREGUARD_CRYPTO_REFC=1

lib_deps =
    lovyan03/LovyanGFX @ ^1.1.16
    bblanchon/ArduinoJson @ ^6.21.5
    links2004/WebSockets @ ^2.4.1
    tzapu/WiFiManager @ ^2.0.16-rc.2
    ayushsharma82/ElegantOTA @ ^3.1.6

; 7.0-inch CYD (Sunton ESP32-8048S070, 800x480) - 預設 OTA
[env:esp32-s3-cyd7]
upload_protocol = custom
upload_command = python3 scripts/ota_upload.py $SOURCE 192.168.3.221
build_flags =
    ${env.build_flags}
    -DBOARD_CYD_70

; 5.0-inch CYD (Sunton ESP32-8048S050, 800x480) - 預設 OTA
[env:esp32-s3-cyd5]
upload_protocol = custom
upload_command = python3 scripts/ota_upload.py $SOURCE 192.168.3.158
build_flags =
    ${env.build_flags}
    -DBOARD_CYD_50

; 有線 USB 燒錄環境 (需要插傳輸線時使用)
[env:esp32-s3-cyd5-usb]
upload_protocol = esptool
upload_speed = 460800
build_flags =
    ${env.build_flags}
    -DBOARD_CYD_50



